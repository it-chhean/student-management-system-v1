spring:
    datasource:
        url: jdbc:h2:mem:testdb
        driver-class-name: org.h2.Driver
        username: sa
        password:
    jpa:
        hibernate:
            ddl-auto: create-drop
        show-sql: true
    mail:
        host: localhost
        port: 25

jwt:
    secret: test-secret-key
    expiration-ms: 86400000
    expiration-refresh: 604800000

app:
    cors:
        allowed-origins: http://localhost:4200,http://localhost:5173

uploads:
    department: ./uploads/departments
    subject: ./uploads/subjects

attendance:
    jwt:
        secret: test-secret-key-min-32-chars-for-testing!!
        expiry-minutes: '10'

otp:
    length: 6
    expiry-seconds: 300
    max-attampts: 5
    resend-cooldown-seconds: 60
