server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:4321/sms_db_26}
    username: ${DB_USERNAME:Chhean}
    password: ${DB_PASSWORD:Chhean168}
    driver-class-name: org.postgresql.Driver

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB

otp:
  length: 6
  expiry-seconds: 300
  max-attampts: 5
  resend-cooldown-seconds: 60

jwt:
  secret: ${JWT_SECRET:your-super-secret-key-must-be-at-least-256-bits-long-for-hs256}
  expiration-ms: 86400000 # 24 hours
  expiration-refresh: 604800000 # 7 day

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true

uploads:
  department: /home/it-bunchhean/Workspace/system-management-system/student-management-api/uploads/departments
  subject: /home/it-bunchhean/Workspace/system-management-system/student-management-api/uploads/subjects

attendance:
  jwt:
    secret: your-very-long-secret-key-min-32-chars-here!!
    expiry-minutes: '10'

app:
  cors:
    allowed-origins: http://localhost:4200,http://localhost:5173,http://localhost:3000
