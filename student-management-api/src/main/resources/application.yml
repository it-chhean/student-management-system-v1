server:
  port: 8080
  servlet:
    context-path: /api/v1

#app:
#  cors:
#    allowed-origins: ${ALLOW_ORIGINS:http://localhost:4200,http://localhost:3000}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:4321/sms_db_26}
    username: ${DB_USERNAME:Chhean}
    password: ${DB_PASSWORD:Chhean168}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB

jwt:
  secret: ${JWT_SECRET:your-super-secret-key-must-be-at-least-256-bits-long-for-hs256}
  expiration-ms: 86400000 # 24 hours
  expiration-refresh: 604800000 # 7 day

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true

uploads:
  department: /home/it-bunchhean/Workspace/system-management-system/student-management-api/uploads/departments
  subject: /home/it-bunchhean/Workspace/system-management-system/student-management-api/uploads/subjects

