services:
  postgres:
    image: postgres:16-alpine
    container_name: sms-backend-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "4321:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

#  pgadmin:
#    image: dpage/pgadmin4
#    container_name: pgadmin_container
#    environment:
#      PGADMIN_DEFAULT_EMAIL: sm@gmail.com
#      PGADMIN_DEFAULT_PASSWORD: smpw
#    ports:
#      - "5050:80"
#    volumes:
#      - pg_data:/var/lib/pgadmin
#    depends_on:
#      - postgres
#    restart: unless-stopped

  redis:
    container_name: sms_redis
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  pg_data:
  redis_data: